{{- /* Admissions note for a school in a table (schools post, Tables 5-7). Hidden until a table link to #<id> is clicked, which
   opens it as a row under that school; a second click closes it. The click handler is in
   _partials/extend_head.html (added to any page that uses this shortcode). */ -}}
<template id="{{ .Get "id" }}">{{ .Page.RenderString (dict "display" "block") .Inner }}</template>
