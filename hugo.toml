baseURL      = "https://titorenko.github.io/analysethat/"
locale       = "en-gb"      # `languageCode` is deprecated as of Hugo 0.158.0
title        = "Analyse That"
theme        = "PaperMod"
timeZone     = "Europe/London"

enableRobotsTXT = true      # PaperMod robots.txt template; includes Sitemap: line
enableGitInfo   = true      # git-based lastmod (pairs with fetch-depth: 0 in CI)

[pagination]
  pagerSize = 10

[minify]
  disableXML = true         # keep --minify away from RSS/sitemap XML

[markup]
  [markup.goldmark.extensions.typographer]
    # The appendix uses two-character Q/C status codes ([--], [-C], [Q-], [QC]).
    # Goldmark's default en-dash substitution folds "--" into a single "–",
    # corrupting 141 of those codes. Emit "--" literally; all other smart
    # punctuation (quotes, em dash, ellipsis) is left at theme/Hugo defaults.
    enDash = "--"
  [markup.highlight]
    noClasses = false       # REQUIRED: classes-based Chroma, styled by PaperMod in both modes
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

[params]
  env          = "production"
  description  = "Long-form quantitative analysis write-ups."
  defaultTheme = "auto"     # FOUC-free by construction (inline pre-paint script in theme head)
  ShowReadingTime     = true
  ShowToc             = true
  ShowBreadCrumbs     = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks    = true

[services]
  [services.googleAnalytics]
    ID = "G-4KVT0WMKBX"     # emitted by PaperMod's head only in production builds

[menus]
  [[menus.main]]
    name = "Posts"
    url  = "posts/"
    weight = 1
  [[menus.main]]
    name = "About"
    url  = "about/"
    weight = 2
