<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 552" width="820" height="552" role="img" aria-labelledby="t d">
<title id="t">Compare like with like and the private-school pay advantage shrinks</title><desc id="d">Forest plot of log-point pay premiums converted to percent, raw (hollow) and adjusted for background and early ability (filled, with 95% CI where a standard error is published), by cohort and age. NCDS 1958, age 33, all: adjusted 7.5%; BCS70, age 34, men: adjusted 20.2%; BCS70, age 34, women: adjusted 27.6%; BCS70, age 42, men: adjusted 34.6%; BCS70, age 42, women: adjusted 21.2%; Next Steps 1989-90, age 25 (background only): adjusted 17.2%; NCDS 1958, age 33, men, vs comprehensive: adjusted 24.6%; Graduates 2006/07, 3.5 yrs, men †: adjusted 9.5%; Graduates 2006/07, 3.5 yrs, women †: adjusted 4.7%; NCDS 1958, age 33, men: adjusted 9.0%; NCDS 1958, age 33, all (RD): adjusted 7.2%; Aberdeen 1950s, late 40s, men (RD): adjusted -2.8%; Aberdeen 1950s, late 40s, women (RD): adjusted 7.7%.</desc>
<style>
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6b6a65; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ind { fill: #2a78d6; stroke: #2a78d6; } .ind-l { stroke: #2a78d6; fill: none; } .ind-band { fill: #2a78d6; opacity: .18; }
  .gra { fill: #eb6834; stroke: #eb6834; } .gra-l { stroke: #eb6834; fill: none; }
  .com { fill: #1baf7a; stroke: #1baf7a; } .com-l { stroke: #1baf7a; fill: none; }
  .neu { fill: #898781; stroke: #898781; } .neu-l { stroke: #898781; fill: none; } .neu-band { fill: #898781; opacity: .14; }
  .hollow { fill: #fcfcfb; stroke-width: 2; }
  .ink { stroke: #0b0b0b; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,.10); }
    .t1 { fill: #ffffff; } .t2 { fill: #c3c2b7; } .t3 { fill: #a9a8a1; }
