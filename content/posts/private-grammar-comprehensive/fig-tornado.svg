<title id="t">Change one assumption at a time and the fees pay in only a few cases, all for boys</title><desc id="d">Tornado chart of NPV at 3.5% for a typical private pupil (central premium, all-employee scenario): men premium scenario low (residual only) -92k, high (1970 cohort) 7k; men discount rate 5% equity -82k, 2.1% borrowing -12k; men earnings scenario B all employees -53k, A full-time -32k; men fees top-20 list median -103k, ISC average -53k; men real fee growth 3% a year -72k, 0% -53k; men extras on fees +15% -76k, +5% -61k; men bursary or sibling discount none -53k, 10% off fees -38k; men real earnings growth 1.2% -61k, 1.83% -46k; men counterfactual rank P50 -63k, P90 18k; women premium scenario low (residual only) -124k, high (1970 cohort) -35k; women discount rate 5% equity -91k, 2.1% borrowing -34k; women earnings scenario B all employees -68k, A full-time -53k; women fees top-20 list median -115k, ISC average -68k; women real fee growth 3% a year -86k, 0% -68k; women extras on fees +15% -90k, +5% -75k; women bursary or sibling discount none -68k, 10% off fees -53k; women real earnings growth 1.2% -79k, 1.83% -65k; women counterfactual rank P50 -81k, P90 -36k.</desc>
