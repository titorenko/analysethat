<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d">
<title id="t">Private-school earnings advantage at 30, by percentile</title><desc id="d">Ratio of independent-school pupils' PAYE earnings at age 30 to state non-FSM pupils', at each percentile: 1.25 at P10, 1.45 at P50, 1.61 at P90, 2.12 at P99 (raw). Within the same GCSE attainment quintile the mean ratio is 1.18-1.39.</desc>
<style>
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6b6a65; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .ind { fill: #2a78d6; stroke: #2a78d6; } .ind-l { stroke: #2a78d6; fill: none; } .ind-band { fill: #2a78d6; opacity: .18; }
  .gra { fill: #eb6834; stroke: #eb6834; } .gra-l { stroke: #eb6834; fill: none; }
  .com { fill: #1baf7a; stroke: #1baf7a; } .com-l { stroke: #1baf7a; fill: none; }
  .neu { fill: #898781; stroke: #898781; } .neu-l { stroke: #898781; fill: none; } .neu-band { fill: #898781; opacity: .14; }
  .hollow { fill: #fcfcfb; stroke-width: 2; }
  .ink { stroke: #0b0b0b; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,.10); }
    .t1 { fill: #ffffff; } .t2 { fill: #c3c2b7; } .t3 { fill: #a9a8a1; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .ind { fill: #3987e5; stroke: #3987e5; } .ind-l { stroke: #3987e5; } .ind-band { fill: #3987e5; }
    .gra { fill: #d95926; stroke: #d95926; } .gra-l { stroke: #d95926; }
    .com { fill: #199e70; stroke: #199e70; } .com-l { stroke: #199e70; }
    .hollow { fill: #1a1a19; }
    .ink { stroke: #ffffff; }
    .halo { stroke: #1a1a19; }
  }
</style>
