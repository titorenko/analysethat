<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="t d">
<title id="t">Grammar sixth-formers lead private ones at Cambridge, but trail them at Oxford and Imperial</title><desc id="d">Places per 1,000 A-level students, 2023 admissions round, English schools, the three universities counted the same way. Cambridge: private 21.3-24.0, grammar 24.9, other state 5.3; Oxford: private 23.6-25.9, grammar 17.1, other state 5.0; Imperial: private 19.6, grammar 15.5, other state 2.7. Oxford grammar possible range 15.2-21.6.</desc>
