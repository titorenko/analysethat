<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 498" width="820" height="498" role="img" aria-labelledby="t d">
<title id="t">Top schools beat nearly every comprehensive on results; on value added the lead shrinks</title><desc id="d">Histograms of 1154 comprehensive sixth forms on A-level points per entry and on value added, with the top private (boys' and girls' lists) and top-30 grammar schools as ticks. On points every top school is above the comprehensive maximum region; on value added the top private median is at the comprehensive 87th percentile and the grammar median at the 62th.</desc>
