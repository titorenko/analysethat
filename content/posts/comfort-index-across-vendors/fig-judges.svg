<title id="t">Each judge's index by model</title><desc id="d">Judge-only index (0-100) from each of the three panel judges for every model, grouped by the model's developer.</desc>
<style>
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
