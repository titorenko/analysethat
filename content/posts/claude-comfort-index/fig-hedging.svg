<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" role="img" aria-labelledby="t d">
<title id="t">Effect of heavily hedged answers</title><desc id="d">Comfort Index on the 26 questions every model answers without heavy hedging at least once: Opus 5.5: 79.7 with all answers, 79.9 without heavily hedged ones, 1% of headline answers heavily hedged; Sonnet 5.5: 78.8 with all answers, 78.8 without heavily hedged ones, 2% of headline answers heavily hedged; Fable 5.1: 74.4 with all answers, 74.5 without heavily hedged ones, 1% of headline answers heavily hedged; Haiku 4.5: 68.1 with all answers, 71.1 without heavily hedged ones, 39% of headline answers heavily hedged; Opus 4.6: 74.8 with all answers, 74.9 without heavily hedged ones, 5% of headline answers heavily hedged; Opus 5: 72.2 with all answers, 72.5 without heavily hedged ones, 5% of headline answers heavily hedged; Sonnet 5: 67.7 with all answers, 69.1 without heavily hedged ones, 19% of headline answers heavily hedged</desc>
<style>
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6b6a65; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .accent { fill: #2a78d6; stroke: #2a78d6; } .accent-line { stroke: #2a78d6; }
  .hollow { fill: #fcfcfb; stroke: #6b6a65; stroke-width: 2; } .hollow-line { stroke: #898781; }
  .orange { fill: #eb6834; stroke: #eb6834; } .link { stroke: #c3c2b7; }
  .neutral { stroke: #898781; stroke-dasharray: 4 4; }
  .halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; }
  .aqua { fill: #1baf7a; stroke: #1baf7a; } .orange-line { stroke: #eb6834; } .aqua-line { stroke: #1baf7a; } .muted { fill: #898781; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,.10); }
    .t1 { fill: #ffffff; } .t2 { fill: #c3c2b7; } .t3 { fill: #a9a8a1; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .accent { fill: #3987e5; stroke: #3987e5; } .accent-line { stroke: #3987e5; }
    .hollow { fill: #1a1a19; stroke: #a9a8a1; } .hollow-line { stroke: #898781; }
    .orange { fill: #d95926; stroke: #d95926; } .link { stroke: #4a4a46; }
    .neutral { stroke: #898781; }
    .halo { stroke: #1a1a19; }
    .aqua { fill: #199e70; stroke: #199e70; } .orange-line { stroke: #d95926; } .aqua-line { stroke: #199e70; }
  }
</style>
