<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 488" width="640" height="488" role="img" aria-labelledby="t d">
<title id="t">Differences between models</title><desc id="d">Differences in Comfort Index with 95 percent paired bootstrap intervals: Opus 5.5 − Fable 5.1 +5.4 (CI +3.2 to +7.3); Opus 5.5 − Sonnet 5.5 +1.4 (CI -0.3 to +3.2); Opus 5.5 − Haiku 4.5 +12.6 (CI +8.3 to +17.3); Fable 5.1 − Sonnet 5.5 -4.0 (CI -6.3 to -1.4); Fable 5.1 − Haiku 4.5 +7.2 (CI +2.5 to +12.2); Sonnet 5.5 − Haiku 4.5 +11.2 (CI +6.5 to +16.1); Opus 5.5 − Opus 5 +8.6 (CI +6.0 to +11.7); Opus 5 − Opus 4.6 -3.3 (CI -7.2 to +0.3); Opus 5.5 − Opus 4.6 +5.3 (CI +2.6 to +8.0); Sonnet 5.5 − Sonnet 5 +10.2 (CI +6.4 to +13.9); Opus 4.6 − Fable 5.1 +0.1 (CI -3.2 to +3.3); Sonnet 5 − Haiku 4.5 +1.0 (CI -4.1 to +6.0)</desc>
<style>
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6b6a65; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .accent { fill: #2a78d6; stroke: #2a78d6; } .accent-line { stroke: #2a78d6; }
  .hollow { fill: #fcfcfb; stroke: #6b6a65; stroke-width: 2; } .hollow-line { stroke: #898781; }
  .orange { fill: #eb6834; stroke: #eb6834; } .link { stroke: #c3c2b7; }
  .neutral { stroke: #898781; stroke-dasharray: 4 4; }
  .halo { paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; }
  .aqua { fill: #1baf7a; stroke: #1baf7a; } .orange-line { stroke: #eb6834; } .aqua-line { stroke: #1baf7a; } .muted { fill: #898781; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,.10); }
    .t1 { fill: #ffffff; } .t2 { fill: #c3c2b7; } .t3 { fill: #a9a8a1; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .accent { fill: #3987e5; stroke: #3987e5; } .accent-line { stroke: #3987e5; }
    .hollow { fill: #1a1a19; stroke: #a9a8a1; } .hollow-line { stroke: #898781; }
    .orange { fill: #d95926; stroke: #d95926; } .link { stroke: #4a4a46; }
    .neutral { stroke: #898781; }
    .halo { stroke: #1a1a19; }
    .aqua { fill: #199e70; stroke: #199e70; } .orange-line { stroke: #d95926; } .aqua-line { stroke: #199e70; }
  }
</style>
