<title id="t">Opus and Sonnet across versions</title><desc id="d">Comfort Index with 95 percent CI, self-report and judge scores by version: Opus 4.6: index 73.2 (CI 69.1-76.9), self-report 70.4, judges 75.9; Opus 5: index 69.9 (CI 65.1-73.9), self-report 70.8, judges 68.9; Opus 5.5: index 78.5 (CI 75.6-81.1), self-report 74.5, judges 82.5; Sonnet 5: index 66.9 (CI 63.0-70.8), self-report 67.3, judges 67.3; Sonnet 5.5: index 77.1 (CI 73.3-80.2), self-report 74.2, judges 79.9</desc>
