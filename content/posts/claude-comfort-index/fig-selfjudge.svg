<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" width="820" height="414" role="img" aria-labelledby="t d">
<title id="t">Self-report versus judge rating by model</title><desc id="d">For each model, the mean of its own 0-100 comfort scores and the mean of the blinded judges' ratings rescaled to 0-100.</desc>
<style>
  .surface { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
  .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #6b6a65; }
  .grid { stroke: #e1e0d9; stroke-width: 1; } .axis { stroke: #c3c2b7; stroke-width: 1; }
  .accent { fill: #2a78d6; stroke: #2a78d6; } .accent-line { stroke: #2a78d6; }
  .hollow { fill: #fcfcfb; stroke: #6b6a65; stroke-width: 2; } .hollow-line { stroke: #898781; }
  .orange { fill: #eb6834; stroke: #eb6834; } .link { stroke: #c3c2b7; }
  .neutral { stroke: #898781; stroke-dasharray: 4 4; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; stroke: rgba(255,255,255,.10); }
    .t1 { fill: #ffffff; } .t2 { fill: #c3c2b7; } .t3 { fill: #a9a8a1; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .accent { fill: #3987e5; stroke: #3987e5; } .accent-line { stroke: #3987e5; }
    .hollow { fill: #1a1a19; stroke: #a9a8a1; } .hollow-line { stroke: #898781; }
    .orange { fill: #d95926; stroke: #d95926; } .link { stroke: #4a4a46; }
    .neutral { stroke: #898781; }
  }
</style>
<rect class="surface" x="0.5" y="0.5" width="819" height="413" rx="8"/>

<text class="t1" x="24" y="30" font-size="15" font-weight="600">Self-report vs judges, headline set (0-100)</text>
<text class="t2" x="24" y="49" font-size="12.5">Labels read self-report / judges. Self-report excludes answers where the model declined to give a number.</text>
<circle class="accent" cx="170" cy="70" r="6" stroke-width="0"/><text class="t2" x="182" y="70" font-size="12.5" dominant-baseline="middle">Self-report (model's own 0-100)</text>
