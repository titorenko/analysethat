<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="t d">
<title id="t">The typical holder earns less than the advertised 4.35%; most £1k holders win nothing</title><desc id="d">Range chart of one-year Premium Bond returns by amount held.</desc>
<style>
